<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" role="img" aria-label="Meet Soni — Backend and Platform Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="55%" stop-color="#15203A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#38BDF8" opacity="0.10"/>
    </pattern>
    <clipPath id="round">
      <rect x="0" y="0" width="1000" height="220" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="220" fill="url(#bg)"/>
    <rect width="1000" height="220" fill="url(#dots)"/>

    <!-- distributed-systems motif -->
    <g transform="translate(858,110)" opacity="0.55">
      <circle r="76" fill="none" stroke="#38BDF8" stroke-opacity="0.18" stroke-width="1"/>
      <circle r="52" fill="none" stroke="#38BDF8" stroke-opacity="0.24" stroke-width="1" stroke-dasharray="3 5"/>
      <circle r="28" fill="none" stroke="#818CF8" stroke-opacity="0.30" stroke-width="1"/>
      <circle cx="0" cy="-76" r="4" fill="#38BDF8"/>
      <circle cx="66" cy="38" r="4" fill="#818CF8"/>
      <circle cx="-66" cy="38" r="4" fill="#38BDF8"/>
      <circle cx="0" cy="52" r="3" fill="#38BDF8" opacity="0.8"/>
      <circle cx="-45" cy="-26" r="3" fill="#818CF8" opacity="0.8"/>
      <circle cx="45" cy="-26" r="3" fill="#38BDF8" opacity="0.8"/>
      <circle r="6" fill="#F8FAFC" opacity="0.9"/>
    </g>

    <!-- accent rule -->
    <rect x="56" y="58" width="5" height="98" rx="2.5" fill="url(#accent)"/>

    <text x="84" y="104" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="52" font-weight="700" fill="#F8FAFC" letter-spacing="-0.5">Meet Soni</text>
    <text x="86" y="138" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="400" fill="#94A3B8">Backend &amp; Platform Engineer</text>

    <g font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="600">
      <rect x="86" y="160" width="58" height="27" rx="13.5" fill="#38BDF8" fill-opacity="0.12" stroke="#38BDF8" stroke-opacity="0.35"/>
      <text x="115" y="178" fill="#7DD3FC" text-anchor="middle">Go</text>

      <rect x="154" y="160" width="106" height="27" rx="13.5" fill="#818CF8" fill-opacity="0.12" stroke="#818CF8" stroke-opacity="0.35"/>
      <text x="207" y="178" fill="#A5B4FC" text-anchor="middle">Kubernetes</text>

      <rect x="270" y="160" width="168" height="27" rx="13.5" fill="#94A3B8" fill-opacity="0.10" stroke="#94A3B8" stroke-opacity="0.30"/>
      <text x="354" y="178" fill="#CBD5E1" text-anchor="middle">Distributed Systems</text>
    </g>
  </g>
</svg>
