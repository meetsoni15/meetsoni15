    <linearGradient id="ln" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/><stop offset="100%" stop-color="#38BDF8" stop-opacity="0.9"/></linearGradient>
  </defs>
  <rect width="1000" height="232" rx="16" fill="url(#bg4)"/>
  <text x="48" y="46" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="600" fill="#F8FAFC">How I got here</text>
