  <circle cx="126" cy="132" r="6" fill="#64748B" stroke="#0F172A" stroke-width="3"/>
  <text x="126" y="162" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#94A3B8" text-anchor="middle">First job. Perl, PHP,</text>
  <text x="126" y="178" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#94A3B8" text-anchor="middle">and a lot of servers.</text>
  <text x="276" y="106" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" fill="#CBD5E1" text-anchor="middle">2018</text>
  <circle cx="276" cy="132" r="6" fill="#64748B" stroke="#0F172A" stroke-width="3"/>
  <text x="276" y="162" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#94A3B8" text-anchor="middle">Led in-house ERP</text>
  <text x="276" y="178" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#94A3B8" text-anchor="middle">and inventory systems.</text>
  <text x="425" y="106" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" fill="#CBD5E1" text-anchor="middle">2019</text>
  <circle cx="425" cy="132" r="6" fill="#64748B" stroke="#0F172A" stroke-width="3"/>
  <text x="425" y="162" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#94A3B8" text-anchor="middle">Product work: APIs,</text>
  <text x="425" y="178" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#94A3B8" text-anchor="middle">databases, infrastructure.</text>
  <text x="575" y="106" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" fill="#CBD5E1" text-anchor="middle">2022</text>
  <circle cx="575" cy="132" r="6" fill="#64748B" stroke="#0F172A" stroke-width="3"/>
  <text x="575" y="162" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#94A3B8" text-anchor="middle">Went all-in on Go.</text>
  <text x="575" y="178" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#94A3B8" text-anchor="middle">Senior engineer.</text>
  <text x="724" y="106" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" fill="#CBD5E1" text-anchor="middle">2024</text>
  <circle cx="724" cy="132" r="6" fill="#64748B" stroke="#0F172A" stroke-width="3"/>
  <text x="724" y="162" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#94A3B8" text-anchor="middle">Technical lead.</text>
  <text x="724" y="178" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#94A3B8" text-anchor="middle">Architecture and teams.</text>
  <text x="874" y="106" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" fill="#F8FAFC" text-anchor="middle">2026</text>
